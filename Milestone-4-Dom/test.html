<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1 class="hi">this is heading </h1>


    <ul>
        <li class="add">one</li>
        <li class="add">two</li>
        <li>three</li>
        <li>four</li>

    <script>

            ul.style.color = "red";
        }
